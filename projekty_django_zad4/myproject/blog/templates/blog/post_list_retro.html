<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>DevLog – moje przygody z tworzeniem gier</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #33ff33;
            font-family: "Courier New", Courier, monospace;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 36px;
            border-bottom: 2px solid #33ff33;
            padding-bottom: 10px;
        }
        .post {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px dashed #33ff33;
            background-color: #262626;
        }
        .post h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .post p {
            font-size: 16px;
            line-height: 1.6;
        }
        .post small {
            display: block;
            margin-top: 10px;
            color: #99ff99;
        }
        hr {
            border: 0;
            height: 1px;
            background: #33ff33;
            margin: 40px 0;
        }
    </style>
</head>
<body>
    <h1>DevLog – moje przygody z tworzeniem gier</h1>
    {% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p>{{ post.content }}</p>
        <small>Dodano: {{ post.created_at }}</small>
    </div>
    {% empty %}
    <p>Brak wpisów w DevLogu.</p>
    {% endfor %}
</body>
</html>
